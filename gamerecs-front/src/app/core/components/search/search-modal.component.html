<!-- Search Modal Container -->
<div *ngIf="isVisible" 
     class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center modal-backdrop"
     (click)="closeOnBackdropClick($event)"
     role="dialog"
     aria-labelledby="searchModalTitle"
     aria-modal="true">
  
  <!-- Modal Content -->
  <div class="bg-[#020d0b] text-[#d7f9f4] p-6 rounded-lg shadow-xl w-[90%] md:w-[50%] relative max-h-[80vh] overflow-y-auto"
       #modalContent>
    
    <!-- Close Button -->
    <button (click)="close()"
            class="absolute top-4 right-4 text-[#d7f9f4] hover:text-[#7beadb] transition-colors"
            aria-label="Close search modal">
      <i class="pi pi-times text-xl"></i>
    </button>
    
    <!-- Modal Title -->
    <h2 id="searchModalTitle" class="text-2xl mb-6 font-fira-sans">Search Games</h2>
    
    <!-- Search Input -->
    <div class="relative">
      <span class="p-input-icon-left w-full">
        <i class="pi pi-search"></i>
        <input type="text" 
               pInputText 
               class="w-full p-3 bg-[#020d0b] border border-[#155b89] rounded-lg focus:border-[#4684e2]"
               [formControl]="searchControl"
               (keydown.escape)="close()"
               placeholder="Search for games (min 2 characters)..."
               aria-label="Search games input">
      </span>
      
      <!-- Search hint -->
      <small class="text-[#7beadb] block mt-2">Type at least 2 characters to search</small>
    </div>

    <!-- Error Message Alert -->
    <div *ngIf="showError && errorMessage" 
         class="mt-4 p-3 bg-red-900 bg-opacity-30 border border-red-700 rounded-lg text-[#d7f9f4] flex items-center justify-between"
         role="alert">
      <div class="flex items-center">
        <i class="pi pi-exclamation-triangle text-red-400 mr-2"></i>
        <span>{{ errorMessage }}</span>
      </div>
      <button (click)="dismissError()" class="text-[#d7f9f4] hover:text-[#7beadb] focus:outline-none" aria-label="Dismiss error">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <!-- Loading Indicator -->
    <div *ngIf="isLoading" class="flex flex-col items-center justify-center my-6">
      <!-- Modern, animated spinner -->
      <p-progressSpinner 
        styleClass="w-12 h-12" 
        strokeWidth="4" 
        fill="transparent" 
        animationDuration=".7s" 
        [style]="{'stroke': '#4684e2'}">
      </p-progressSpinner>
      
      <!-- Animated "Searching for games..." message -->
      <div class="text-[#7beadb] mt-4 text-center">
        <span class="searching-text">Searching for games</span>
        <span class="dot-one">.</span>
        <span class="dot-two">.</span>
        <span class="dot-three">.</span>
      </div>
    </div>

    <!-- Search Results -->
    <div *ngIf="searchResults.length > 0 && !isLoading" class="mt-4">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xl font-fira-sans">Results</h3>
        <span class="text-sm text-[#7beadb]">Found {{totalElements}} games</span>
      </div>
      
      <div class="grid grid-cols-1 gap-4 mb-4">
        <button *ngFor="let game of searchResults" 
             class="p-3 border border-[#155b89] rounded-lg hover:border-[#4684e2] transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#4684e2]"
             tabindex="0"
             (click)="navigateToGame(game, $event)"
             (keydown.enter)="navigateToGame(game, $event)">
          <div class="flex items-center">
            <div class="w-16 mr-3 rounded bg-[#155b89] overflow-hidden aspect-[3/4]" *ngIf="!game.coverImageUrl"></div>
            <div class="w-16 mr-3 rounded overflow-hidden aspect-[3/4]" *ngIf="game.coverImageUrl">
              <img [src]="game.coverImageUrl" [alt]="game.title + ' cover'" class="w-full h-full object-cover">
            </div>
            <div>
              <h4 class="text-[#7beadb] font-bold">{{game.title}}</h4>
              <p *ngIf="game.releaseDate" class="text-sm">Released: {{game.releaseDate | date:'mediumDate'}}</p>
              <p *ngIf="!game.releaseDate" class="text-sm text-gray-400">Release date unknown</p>
            </div>
          </div>
        </button>
      </div>
      
      <!-- Pagination Controls -->
      <p-paginator *ngIf="totalPages > 1"
                  [rows]="pageSize"
                  [totalRecords]="totalElements"
                  [first]="currentPage * pageSize"
                  [rowsPerPageOptions]="[50]"
                  (onPageChange)="onPageChange($event)"
                  styleClass="bg-[#020d0b] border-t border-[#155b89] p-2"></p-paginator>
    </div>

    <!-- No Results -->
    <div *ngIf="searchControl.value && searchControl.value.length >= 2 && searchResults.length === 0 && !isLoading" 
         class="mt-4 p-4 text-center border border-[#155b89] rounded-lg">
      <p class="text-[#7beadb]">No games found matching your search.</p>
    </div>

    <!-- Future Features Section -->
    <div *ngIf="!searchControl.value || searchControl.value.length < 2" class="mt-4 text-sm text-[#7beadb]">
      <p>Coming soon:</p>
      <ul class="list-disc list-inside">
        <li>Filter by genre/platform</li>
        <li>Import from external libraries</li>
      </ul>
    </div>
  </div>
</div>
