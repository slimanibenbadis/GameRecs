spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false  # Disable Flyway for tests - H2 doesn't need the PostgreSQL UNACCENT extension
  mail:
    host: localhost
    port: 3025
    username: test
    password: test
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
            redirect-uri: http://localhost:4200/auth/google/callback
  # Cache Configuration for Tests
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

# IGDB Configuration
igdb:
  client-id: test-client-id
  access-token: test-access-token
  update:
    timeout: 30  # Set a reasonable timeout for IGDB updates in tests

# Provide a dummy value for the Steam API key to allow context loading during tests
steam:
  api:
    key: TEST_STEAM_API_KEY_DUMMY

# App specific configuration
app:
  verification:
    base-url: http://localhost:4200 # Dummy URL for tests
    token:
      expiration-hours: 1 # Short expiration for tests
  jwt:
    secret: test-super-secret-jwt-key-for-gamerecs-project-longer-than-256-bits-please-ignore # Dummy secret for tests
    expiration-ms: 3600000 # 1 hour for tests
  oauth2:
    redirectUri: http://localhost:4200/auth/google/callback # Dummy redirect URI for tests
    expectedState: test_state
  security:
    login:
      max-attempts: 5
      lockout-duration-minutes: 10
  encryption: # Encryption settings for test profile
    key: TestKeyForEncryptionService12345 # Dummy key for tests
    salt: abcdef1234567890abcdef1234567890 # Dummy salt for tests (32 hex chars)

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
    syntaxHighlight:
      activated: true

# CORS Configuration for tests
allowed:
  origins: http://localhost:4200

logging:
  level:
    com.gamerecs: DEBUG
    org.hibernate.SQL: DEBUG
    org.springdoc: DEBUG  # Added for debugging Swagger/OpenAPI issues 
    org.springframework.cache: TRACE  # Enable cache logging for testing

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: db,diskSpace,ping
        liveness:
          include: ping
    caches:
      enabled: true
  health:
    mail:
      enabled: false
    livenessState:
      enabled: true
    readinessState:
      enabled: true 

# Cache Configuration for tests
cache:
  igdb:
    ttl-minutes: 10
    max-size: 100 
